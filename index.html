<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scope Capture System</title>

    <link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
  
    <script defer src="electrical.js"></script>
<script defer src="falseceiling.js"></script>
    <script defer src="civil.js"></script>
    <script defer src="plumbing.js"></script>
<script defer src="carpentry.js"></script>
<script defer src="paint.js"></script>
    
    
<!-- Future -->
<!--
<script defer src="civil.js"></script>
<script defer src="carpentry.js"></script>
<script defer src="plumbing.js"></script>
-->

<script defer src="questionBank.js"></script>

<script defer src="script.js"></script>

<script defer src="export.js"></script>

    
</head>

<body>

    <header class="app-header">
        <div class="logo">
            <h2>Scope Capture System</h2>
            <span>Interior Project HOTO</span>
        </div>

        <div class="project-summary" id="projectSummary">
            New Project
        </div>
    </header>

    <nav class="top-nav">

        <button class="tab-btn active"
            data-tab="projectTab">
            Project Details
        </button>

        <button class="tab-btn"
            data-tab="roomsTab">
            Room Selection
        </button>

        <button class="tab-btn"
            data-tab="hotoTab">
            HOTO
        </button>

    </nav>

    <main>

        <!-- ======================================================= -->
        <!-- PROJECT DETAILS -->
        <!-- ======================================================= -->

        <section id="projectTab" class="tab-content active">

            <div class="page-title">
                Project Details
            </div>

            <div class="form-grid">

                <div class="field">
                    <label>Project ID</label>
                    <input type="text" id="projectName">
                </div>

                <div class="field">
                    <label>Client Name</label>
                    <input type="text" id="clientName">
                </div>

                <div class="field">
                    <label>City</label>

                    <select id="city">
                       <option value="">Select City</option>
<option value="Ahmedabad">Ahmedabad</option>
<option value="Bangalore">Bangalore</option>
<option value="Bhopal">Bhopal</option>
<option value="Bhubaneswar">Bhubaneswar</option>
<option value="Chandigarh">Chandigarh</option>
<option value="Chennai">Chennai</option>
<option value="Coimbatore">Coimbatore</option>
<option value="Delhi">Delhi</option>
<option value="Goa">Goa</option>
<option value="Gurgaon">Gurgaon</option>
<option value="Guwahati">Guwahati</option>
<option value="Hyderabad">Hyderabad</option>
<option value="Indore">Indore</option>
<option value="Jaipur">Jaipur</option>
<option value="Kolkata">Kolkata</option>
<option value="Lucknow">Lucknow</option>
<option value="Mumbai">Mumbai</option>
<option value="Nagpur">Nagpur</option>
<option value="Nasik">Nasik</option>
<option value="Noida">Noida</option>
<option value="Patna">Patna</option>
<option value="Pune">Pune</option>
<option value="Raipur">Raipur</option>
<option value="Ranchi">Ranchi</option>
<option value="Surat">Surat</option>
<option value="Vadodara">Vadodara</option>
<option value="Vizag">Vizag</option>
<option value="Kochi">Kochi</option>
<option value="Vijayawada">Vijayawada</option>
                    </select>

                </div>

                <div class="field">
                    <label>BU</label>

                    <select id="configuration">
                        <option>Vesta</option>
                        <option>Reno+</option>
                        <option>Select</option>
                        <option>Kitchen Reno/Reno</option>
                        <option>Bello</option>
                        <option>Vinciago</option>
                    </select>

                </div>

                <div class="field">
                    <label>Designer mail ID</label>
                    <input type="text" id="designer">
                </div>

                <div class="field">
                    <label>RFV ID</label>
                    <input type="text" id="qs">
                </div>

                <div class="field full-width">
                    <label>Drive link (line diagrams, 3D,etc)</label>
                    <textarea id="address"></textarea>
                </div>

                <div class="field full-width">
                    <label>Any Remarks</label>
                    <textarea id="projectRemarks"></textarea>
                </div>

            </div>

            <div class="page-footer">

                <button id="projectNextBtn"
                    class="primary-btn">
                    Continue →
                </button>

            </div>

        </section>


    
        
        
        <!-- ======================================================= -->
        <!-- ROOM SELECTION -->
        <!-- ======================================================= -->

        <section id="roomsTab" class="tab-content">

     <div class="room-toolbar">

    <button id="selectAllRooms" class="secondary-btn">
        Select All
    </button>

    <button id="clearAllRooms" class="secondary-btn">
        Clear All
    </button>

    <button id="addRoomBtn" class="primary-btn">
        + Add Room
    </button>

</div>
            
            <div class="page-title">

                Select Applicable Rooms

            </div>

            <div id="roomContainer"
                class="room-grid">

                <!-- Generated using JS -->

            </div>

            <div class="page-footer">

                <button id="roomBackBtn"
                    class="secondary-btn">

                    ← Back

                </button>

                <button id="roomNextBtn"
                    class="primary-btn">

                    Generate HOTO →

                </button>

            </div>

        </section>

        <!-- ======================================================= -->
        <!-- HOTO -->
        <!-- ======================================================= -->

        <section id="hotoTab" class="tab-content">

            <div class="hoto-layout">

                <!-- LEFT PANEL -->

                <aside class="sidebar">

                    <div id="tradeTree"></div>

                    <ul id="categoryMenu">

                        <!-- Generated using JS -->

                    </ul>

                </aside>

                <!-- RIGHT PANEL -->

                <section class="content">

                    <div class="content-header">

                        <div>

                          <h2 id="categoryTitle"></h2>

                            <span id="categoryProgress">

                                0 / 0 Completed

                            </span>

                        </div>

                    </div>


                    <div class="export-actions">

    <button
        id="exportExcelBtn"
        class="secondary-btn">
        ↓ Excel
    </button>

    <button
        id="exportPdfBtn"
        class="primary-btn">
        ↓ PDF
    </button>

</div>

                    <div class="room-scroll-hint">

    <span>Room-wise responses</span>

    <span class="scroll-message">
        ← Scroll horizontally to view selected rooms →
    </span>

</div>
                    <div class="table-container">

                        <table id="scopeTable">

                            <thead>
            

                            </thead>

                            <tbody id="tableBody">

                            </tbody>

                        </table>

                    </div>

                </section>

            </div>

        </section>

    </main>

    

</body>

</html>
